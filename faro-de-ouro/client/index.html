<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-faro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/icon-faro.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Faro de Ouro</title>
    <script>
      // Capture the PWA install event globally as early as possible
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        // Dispatch a custom event so React components can pick it up immediately
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
